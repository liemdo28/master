name: Preview DB Repair

on:
  workflow_dispatch:
    inputs:
      repair_only:
        description: 'Skip file deploy, just run repair'
        required: false
        default: 'false'
        type: boolean

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DH_SSH_KEY || secrets.DREAMHOST_SSH_KEY }}

      - name: Add DreamHost host key
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts << 'EOF'
          pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ssh-rsa 
          pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFeH7+zp7F4iYI1FUXetzrE4gRoZSigkqW7trL+i0xbFsxWDz+C9SWYhZmiwtqIlLVDIXJFPJbvA52/MKSv9UXA=
          pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPa5+IX4bwHJnNvhO0hll6+uYM7Zc0kzEXiZ2OyzXPxQ
          EOF

      - name: Deploy files to DreamHost (rsync)
        if: github.event.inputs.repair_only != 'true'
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --exclude ".claude" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "vendor" \
            --exclude "uploads" \
            --exclude "storage" \
            --exclude "tmp" \
            --exclude "NUL" \
            -e "ssh" \
            ./ "${DH_USER}@${DH_HOST}:${DH_PATH}/"

      - name: Run preview DB repair via SSH
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh "${DH_USER}@${DH_HOST}" "
            cd \${DH_PATH} && 
            php -r 'if(function_exists(\"opcache_reset\")) opcache_reset();' && 
            echo 'OPcache cleared' && 
            curl -s 'https://preview.dashboard.bakudanramen.com/repair_preview.php' || 
            curl -s 'https://preview.dashboard.bakudanramen.com/migrate.php?repair=1'
          "

      - name: Verify repair status
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          echo '=== Checking DB repair status ==='
          ssh "${DH_USER}@${DH_HOST}" "
            cd \${DH_PATH} && 
            php -r '
              \$pdo = new PDO(
                \"mysql:host=mysql-taskflow.bakudanramen.com;dbname=preview_database;charset=utf8mb4\",
                \"liemdo\", \"liem@dt2155\",
                [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]
              );
              \$orphans = \$pdo->query(\"SELECT COUNT(*) as cnt FROM tasks t LEFT JOIN sections s ON s.id = t.section_id WHERE t.section_id IS NOT NULL AND s.id IS NULL\")->fetchColumn();
              \$sections = \$pdo->query(\"SELECT COUNT(*) FROM sections\")->fetchColumn();
              \$cols = \$pdo->query(\"SHOW COLUMNS FROM sections\")->fetchAll(PDO::FETCH_COLUMN, 1);
              echo json_encode([\"orphans\" => \$orphans, \"sections\" => \$sections, \"columns\" => \$cols], JSON_PRETTY_PRINT);
            '
          "
