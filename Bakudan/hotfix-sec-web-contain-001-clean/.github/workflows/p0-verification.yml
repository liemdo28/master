name: P0 Verification Preview

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run DB migrations before verify
        required: false
        default: 'true'
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DH_SSH_KEY || secrets.DREAMHOST_SSH_KEY }}

      - name: Add DreamHost host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' \
            'pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ssh-rsa ' \
            'pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFeH7+zp7F4iYI1FUXetzrE4gRoZSigkqW7trL+i0xbFsxWDz+C9SWYhZmiwtqIlLVDIXJFPJbvA52/MKSv9UXA=' \
            'pdx1-shared-a3-05.dreamhost.com,69.163.140.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPa5+IX4bwHJnNvhO0hll6+uYM7Zc0kzEXiZ2OyzXPxQ' \
            >> ~/.ssh/known_hosts

      - name: Deploy files to preview
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          rsync -az --delete \
            --exclude ".git" --exclude ".github" --exclude ".env" --exclude ".env.preview" \
            --exclude ".claude" --exclude "uploads" --exclude "tmp" \
            -e "ssh" ./ "${DH_USER}@${DH_HOST}:${DH_PATH}/"
          echo "Deploy done"

      - name: Run migrations
        if: ${{ github.event.inputs.run_migrations == 'true' }}
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh "${DH_USER}@${DH_HOST}" "php ${DH_PATH}/scripts/run_migrations_p0.php"

      - name: Run P0 verification
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh "${DH_USER}@${DH_HOST}" "php ${DH_PATH}/scripts/cli_p0_verify.php" || true

      - name: Run duplicate scanner
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh "${DH_USER}@${DH_HOST}" "php ${DH_PATH}/scripts/cli_scanner.php" || true

      - name: Dump duplicate groups (for cleanup plan)
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh "${DH_USER}@${DH_HOST}" "php ${DH_PATH}/scripts/dump_duplicate_groups.php" || true
