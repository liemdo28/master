<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Chat — Cross-Device</title>
<style>
:root{--bg:#0a0a0f;--sb:#0d0d14;--card:#13131e;--bd:#1e1e2e;--a:#7c3aed;--a2:#6d28d9;--g:#10b981;--m:#64748b;--y:#f59e0b;--b:#3b82f6;--t:#e2e8f0;--ib:#1a1a28;--ub:#7c3aed;--mb:#1e293b;--rds:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex}
/* sidebar */
#sidebar{width:300px;min-width:300px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh}
#sb-hdr{padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
#sb-hdr h2{font-size:16px;font-weight:700;flex:1}
#sync-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--g);color:#fff;font-weight:600}
#sync-badge.offline{background:var(--m)}#sync-badge.syncing{background:var(--y)}
#new-btn{margin:12px;padding:10px;background:var(--a);color:#fff;border:none;border-radius:var(--rds);cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
#new-btn:hover{background:var(--a2)}
#conv-list{flex:1;overflow-y:auto;padding:4px 8px}
.ci{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .15s;border:1px solid transparent}
.ci:hover{background:var(--card)}.ci.active{background:var(--card);border-color:var(--a)}
.ci-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-p{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-m{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.ci-tm{font-size:10px;color:var(--m)}.ci-bdg{background:var(--a);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;display:none}
.ci-bdg.show{display:block}
#sb-ft{padding:12px;border-top:1px solid var(--bd);font-size:11px;color:var(--m);text-align:center}
/* chat area */
#ca{flex:1;display:flex;flex-direction:column;height:100vh}
#ch{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;background:var(--sb)}
#ch-i{flex:1}#ch-t{font-size:15px;font-weight:700}#ch-s{font-size:11px;color:var(--m);margin-top:2px}
#ch-a{display:flex;gap:8px}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--m);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.ib:hover{border-color:var(--a);color:var(--a);background:rgba(124,58,237,.1)}
/* messages */
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
#msgs-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m);text-align:center;gap:12px}
#msgs-empty-icon{font-size:48px}#msgs-empty h3{font-size:18px;color:var(--t)}#msgs-empty p{font-size:13px;max-width:320px;line-height:1.6}
.msg{display:flex;gap:10px;max-width:80%;animation:mi .25s ease-out}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.mi{align-self:flex-start}
.mav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;margin-top:2px}
.msg.user .mav{background:var(--a);color:#fff}.msg.mi .mav{background:#1e3a5f;color:var(--b)}
.mbd{display:flex;flex-direction:column;gap:4px}.msg.user .mbd{align-items:flex-end}.msg.mi .mbd{align-items:flex-start}
.mb{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user .mb{background:var(--ub);color:#fff;border-bottom-right-radius:4px}
.msg.mi .mb{background:var(--mb);color:var(--t);border-bottom-left-radius:4px}
.mb code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}
.mb pre{background:rgba(0,0,0,.4);padding:10px;border-radius:8px;overflow-x:auto;margin-top:6px}
.mb pre code{background:none;padding:0}
.mt{font-size:10px;color:var(--m);padding:0 4px}
.msg.system .mb{background:transparent;border:1px dashed var(--bd);color:var(--m);font-size:12px;text-align:center;border-radius:8px;font-style:italic}
.typing{display:flex;gap:10px;max-width:80%;align-self:flex-start}
.td{width:8px;height:8px;border-radius:50%;background:var(--m);animation:tB 1.4s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tB{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* input */
#ia{padding:12px 20px 16px;border-top:1px solid var(--bd);background:var(--sb)}
#ir{display:flex;gap:10px;align-items:flex-end}
#ib{flex:1;background:var(--ib);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 14px;color:var(--t);font-size:14px;font-family:inherit;resize:none;outline:none;min-height:44px;max-height:200px;line-height:1.5;transition:border-color .2s}
#ib:focus{border-color:var(--a)}#ib::placeholder{color:var(--m)}
#sbtn{padding:10px 20px;background:var(--a);color:#fff;border:none;border-radius:var(--rds);cursor:pointer;font-size:14px;font-weight:600;transition:background .2s;white-space:nowrap}
#sbtn:hover{background:var(--a2)}#sbtn:disabled{background:var(--m);cursor:not-allowed}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
#modal.show{display:flex}
#m-inner{background:var(--card);border:1px solid var(--bd);border-radius:var(--rds);padding:24px;width:400px;max-width:90vw}
#m-inner h3{font-size:16px;margin-bottom:16px}
#m-inner input,#m-inner select{width:100%;padding:10px 14px;background:var(--ib);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:14px;margin-bottom:12px;outline:none}
#m-inner input:focus,#m-inner select:focus{border-color:var(--a)}
#m-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:none;transition:background .2s}
.btn-pri{background:var(--a);color:#fff}.btn-pri:hover{background:var(--a2)}
.btn-sec{background:transparent;border:1px solid var(--bd);color:var(--m)}.btn-sec:hover{border-color:var(--t);color:var(--t)}
/* search overlay */
#search-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-start;justify-content:center;padding-top:80px}
#search-overlay.show{display:flex}
#search-box{background:var(--card);border:1px solid var(--bd);border-radius:var(--rds);padding:20px;width:500px;max-width:90vw}
#search-box h3{margin-bottom:12px;font-size:15px}
#search-box input{width:100%;padding:10px 14px;background:var(--ib);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:14px;outline:none;margin-bottom:10px}
#search-box input:focus{border-color:var(--a)}
#search-results{max-height:300px;overflow-y:auto}
.sr{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:6px;margin-bottom:4px}
.sr:hover{background:var(--ib)}.sr-title{font-size:13px;font-weight:600}.sr-preview{font-size:11px;color:var(--m);margin-top:2px}
</style>
</head>
<body>
<div id=sidebar>
  <div id=sb-hdr><h2>Mi Chat</h2><span id=sync-badge>Connecting</span></div>
  <button id=new-btn onclick="document.getElementById('modal').classList.add('show');document.getElementById('m-title').focus()">+ New Conversation</button>
  <div id=conv-list></div>
  <div id=sb-ft>Cross-Device Sync Active</div>
</div>

<div id=ca>
  <div id=ch>
    <div id=ch-i><div id=ch-t>Select a conversation</div><div id=ch-s>or create a new one</div></div>
    <div id=ch-a>
      <button class=ib onclick=searchConv() title=Search>&#128269;</button>
      <button class=ib onclick=pinConv() title=Pin>&#128204;</button>
      <button class=ib onclick=archiveConv() title=Archive>&#128465;</button>
    </div>
  </div>
  <div id=msgs>
    <div id=msgs-empty>
      <div id=msgs-empty-icon>&#128172;</div>
      <h3>Welcome to Mi Chat</h3>
      <p>Your conversations sync across all devices in real-time via SSE. Select a conversation or create a new one to get started.</p>
    </div>
  </div>
  <div id=ia>
    <div id=ir><textarea id=ib placeholder="Message Mi..." rows=1 onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}" oninput="autoGrow(this)"></textarea><button id=sbtn onclick=sendMsg() disabled>Send</button></div>
  </div>
</div>

<!-- New conversation modal -->
<div id=modal>
  <div id=m-inner>
    <h3>New Conversation</h3>
    <input id=m-title placeholder="Conversation title..." onkeydown="if(event.key==='Enter')createConv()">
    <select id=m-type>
      <option value=general>General
      <option value=project>Project
      <option value=task>Task
      <option value=approval>Approval
      <option value=evidence>Evidence
    </select>
    <div id=m-btns>
      <button class="btn btn-sec" onclick="document.getElementById('modal').classList.remove('show')">Cancel</button>
      <button class="btn btn-pri" onclick=createConv()>Create</button>
    </div>
  </div>
</div>

<!-- Search overlay -->
<div id=search-overlay onclick="if(event.target===this)this.classList.remove('show')">
  <div id=search-box>
    <h3>Search Conversations & Messages</h3>
    <input id=search-input placeholder="Type to search..." oninput="do
